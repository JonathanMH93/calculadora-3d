.detalle-img,.portfolio-preview{max-width:100%;width:auto;height:auto;margin-top:10px;border-radius:8px;display:block}

</head>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, setDoc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
apiKey:"AIzaSyClTMXXUlDDK0txPwr1Q5SFYkytC9RQvGA",
authDomain:"calculadora-3d-876b3.firebaseapp.com",
projectId:"calculadora-3d-876b3"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.db=db;
window.collection=collection;
window.addDoc=addDoc;
window.getDocs=getDocs;
window.deleteDoc=deleteDoc;
window.doc=doc;
window.setDoc=setDoc;
window.getDoc=getDoc;
window.updateDoc=updateDoc;
window.dispatchEvent(new Event("firebase-ready"));
</script>

<script>

let configData={costoKg:20,extraFil:20,extraTime:10,costoHora:0.23,costoEnergia:0.2,porcentajeGanancia:60}
let ultima={}
let cotizacionesCache=[]
let ventasCache=[]
let portafolioCache=[]
let filtroVenta="all"

function esperarFirebase(){
return new Promise((resolve,reject)=>{
if(window.db) return resolve()
const listo=()=>{clearTimeout(t);resolve()}
const t=setTimeout(()=>reject(new Error("No se pudo conectar con Firebase. Revisa tu internet e intenta de nuevo.")),15000)
window.addEventListener("firebase-ready",listo,{once:true})
})
}

function mensajeFirebaseError(e){
const code=e?.code||""
if(code==="permission-denied") return "Permiso denegado en Firebase. En Firestore Rules debes permitir lectura/escritura (incluye colección portafolio)."
if(code==="unavailable") return "Firebase no disponible en este momento. Intenta otra vez."
if(String(e?.message||"").toLowerCase().includes("longer than")) return "La imagen es demasiado grande para guardar. Usa una foto más pequeña."
return e?.message||"Error desconocido al conectar con Firebase."
}

function esImagenValida(src){
return typeof src==="string"&&src.startsWith("data:image/")&&src.length>500
}

const LIMITE_IMG_FIRESTORE=1040000

// Guarda igual que las cotizaciones antiguas: data:image/jpeg;base64,... sin canvas
async function imagenParaGuardar(entrada){
if(typeof entrada==="string"){
if(!esImagenValida(entrada)) throw new Error("Formato de imagen no válido")
return entrada
}

const dataUrl=await fileToBase64(entrada)
if(!esImagenValida(dataUrl)) throw new Error("Formato de imagen no válido. Usa JPG o PNG.")
if(dataUrl.length>LIMITE_IMG_FIRESTORE) throw new Error("La imagen es muy pesada para Firebase. Usa una foto menor a ~750 KB.")
return dataUrl
}

// CONFIG
async function cargarConfig(){
try{
await esperarFirebase()
let ref=doc(db,"config","default")
let snap=await getDoc(ref)

if(snap.exists()) configData={...configData,...snap.data()}
else await setDoc(ref,configData)

costoKg.value=configData.costoKg
extraFil.value=configData.extraFil
extraTime.value=configData.extraTime
costoHora.value=configData.costoHora
costoEnergia.value=configData.costoEnergia
porcentajeGanancia.value=configData.porcentajeGanancia
}catch(e){alert(mensajeFirebaseError(e))}
}

async function guardarConfig(){
try{
await esperarFirebase()
configData={
costoKg:+costoKg.value||0,
extraFil:+extraFil.value||0,
extraTime:+extraTime.value||0,
costoHora:+costoHora.value||0,
costoEnergia:+costoEnergia.value||0,
porcentajeGanancia:+porcentajeGanancia.value||0
}
await setDoc(doc(db,"config","default"),configData)
alert("Configuración guardada")
}catch(e){alert(mensajeFirebaseError(e))}
}

// CALC
function calcular(){
let f=+fil.value||0
let h1=+h.value||0
let m1=+m.value||0

let total=((f*(1+configData.extraFil/100)/1000)*configData.costoKg)+
((h1+m1/60)*(1+configData.extraTime/100)*(configData.costoHora+configData.costoEnergia))

total*=1+(configData.porcentajeGanancia/100)
total=Number(total.toFixed(2))

document.getElementById("total").innerText=total.toFixed(2)

ultima={f,h:h1,m:m1,total}

btnCot.style.display="block"
}

function irCot(){
mostrar("quotes",document.querySelectorAll(".tab")[1])
}

// ===== COTIZACIONES =====

function limpiarCot(){
cotId.value=""
desc.value=""
link.value=""
obs.value=""
foto.value=""
const prev=document.getElementById("cotPreview")
if(prev){prev.src="";prev.style.display="none"}
}

function fileToBase64(file){
return new Promise((resolve,reject)=>{
let reader=new FileReader()
reader.readAsDataURL(file)
reader.onload=()=>resolve(reader.result)
reader.onerror=reject
})
}

async function guardarCot(){

if(!desc.value) return alert("Descripción requerida")
if(!ultima.total) return alert("Primero calcula el precio en la pestaña Calcular")

try{
await esperarFirebase()

let imgData=""
if(foto.files[0]){
imgData=await imagenParaGuardar(foto.files[0])
}else if(cotId.value){
let actual=cotizacionesCache.find(x=>x.id===cotId.value)
imgData=actual?.img||""
}

let data={
...ultima,
desc:desc.value,
link:link.value,
obs:obs.value,
img:imgData,
total:Number(ultima.total.toFixed(2))
}

if(cotId.value){
await updateDoc(doc(db,"cotizaciones",cotId.value),data)
alert("Cotización actualizada")
}else{
await addDoc(collection(db,"cotizaciones"),data)
alert("Cotización guardada")
}

limpiarCot()
cargarCot()
}catch(e){alert(mensajeFirebaseError(e))}
}

async function cargarCot(){

try{
await esperarFirebase()
let snap=await getDocs(collection(db,"cotizaciones"))
cotizacionesCache=[]

let html=""

snap.forEach(d=>{
let c={id:d.id,...d.data()}
cotizacionesCache.push(c)

html+=`
<div class="card line" onclick="verDetalleCot('${c.id}')">
<div>
<b>${c.desc}</b><br>
$${Number(c.total).toFixed(2)}
</div>

<div>
<button onclick="event.stopPropagation(); editarCot('${c.id}')">✏️</button>
<button onclick="event.stopPropagation(); crearVenta('${c.id}')">💵</button>
<button onclick="event.stopPropagation(); enviarAPortafolio('${c.id}')">🖼</button>
<button onclick="event.stopPropagation(); eliminarCot('${c.id}')">🗑</button>
</div>
</div>`
})

listaCot.innerHTML=html
}catch(e){
listaCot.innerHTML=""
alert(mensajeFirebaseError(e))
}
}

function verDetalleCot(id){

let c=cotizacionesCache.find(x=>x.id==id)

detalleCot.innerHTML=`
<div class="card" id="detalleCotCard">
<h3>${escapeHtml(c.desc)}</h3>
<b>Total:</b> $${Number(c.total).toFixed(2)}<br><br>

<b>Observaciones:</b><br>
${escapeHtml(c.obs || "-")}<br><br>

<b>Enlace:</b><br>
${c.link ? `<a href="${escapeHtml(c.link)}" target="_blank">Ver modelo</a>` : "-"}<br>
</div>
`

if(esImagenValida(c.img)){
const img=document.createElement("img")
img.className="detalle-img"
img.alt=c.desc||"Foto"
img.src=c.img
document.getElementById("detalleCotCard").appendChild(img)
}
}

function editarCot(id){
let c=cotizacionesCache.find(x=>x.id==id)

cotId.value=c.id
desc.value=c.desc||""
link.value=c.link||""
obs.value=c.obs||""

const prev=document.getElementById("cotPreview")
if(prev){
if(esImagenValida(c.img)){prev.src=c.img;prev.style.display="block"}
else{prev.src="";prev.style.display="none"}
}

mostrar("quotes",document.querySelectorAll(".tab")[1])
}

async function eliminarCot(id){
if(!confirm("Eliminar cotización?")) return
try{
await esperarFirebase()
await deleteDoc(doc(db,"cotizaciones",id))
cargarCot()
}catch(e){alert(mensajeFirebaseError(e))}
}

function crearVenta(id){
let c=cotizacionesCache.find(x=>x.id==id)

mostrar("sales",document.querySelectorAll(".tab")[2])

setTimeout(()=>{
precio.value=c.total
figura.value=c.desc
},50)
}

function enviarAPortafolio(id){
let c=cotizacionesCache.find(x=>x.id===id)
if(!c) return
if(!esImagenValida(c.img)) return alert("Esta cotización no tiene imagen para enviar al portafolio")

mostrar("portfolio",document.querySelectorAll(".tab")[3])

setTimeout(()=>{
portId.value=""
portNombre.value=c.desc||""
let lineas=[]
if(c.obs) lineas.push(c.obs)
if(c.total!=null) lineas.push("Precio: $"+Number(c.total).toFixed(2))
portCaracteristicas.value=lineas.join("\n")
portImgData.value=c.img
portFoto.value=""
mostrarPreviewPort(c.img)
window.scrollTo({top:0,behavior:"smooth"})
},50)
}

// ===== VENTAS =====

function limpiarVenta(){
ventaId.value=""
cliente.value=""
precio.value=""
figura.value=""
pagado.checked=false
fechaVenta.value=""
}

async function guardarVenta(){

if(!cliente.value) return alert("Cliente requerido")

try{
await esperarFirebase()

let fechaVal = fechaVenta.value 
  ? new Date(fechaVenta.value)
  : new Date()

let data={
cliente:cliente.value,
precio:Number((+precio.value||0).toFixed(2)),
figura:figura.value,
pagado:pagado.checked,
fecha:fechaVal
}

if(ventaId.value){
await updateDoc(doc(db,"ventas",ventaId.value),data)
alert("Venta actualizada")
}else{
await addDoc(collection(db,"ventas"),data)
alert("Venta guardada")
}

limpiarVenta()
cargarVentas()
}catch(e){alert(mensajeFirebaseError(e))}
}

function setFiltro(tipo){
filtroVenta=tipo
cargarVentas()
}

async function cargarVentas(){

try{
await esperarFirebase()
let snap=await getDocs(collection(db,"ventas"))
ventasCache=[]

let total=0
let totalPagado=0
let totalPendiente=0

let html=""

snap.forEach(d=>{
let v={id:d.id,...d.data()}
ventasCache.push(v)

if(filtroVenta==="pagado" && !v.pagado) return
if(filtroVenta==="pendiente" && v.pagado) return

let fecha = v.fecha?.seconds
  ? new Date(v.fecha.seconds * 1000)
  : new Date()

let precio = Number(v.precio||0)

total += precio
if(v.pagado) totalPagado += precio
else totalPendiente += precio

html+=`
<div class="card line" onclick="verDetalleVenta('${v.id}')">

<div>
<b>${v.cliente}</b><br>
$${precio.toFixed(2)}<br>
${fecha.toLocaleDateString()}<br>

<span style="color:${v.pagado?"#22c55e":"#ef4444"}">
${v.pagado?"Pagado":"Pendiente"}
</span>
</div>

<div>
<button onclick="event.stopPropagation(); editarVenta('${v.id}')">✏️</button>
<button onclick="event.stopPropagation(); togglePagado('${v.id}')">✔</button>
<button onclick="event.stopPropagation(); eliminarVenta('${v.id}')">🗑</button>
</div>

</div>`
})

listaVentas.innerHTML=html

resumenVentas.innerHTML=`
<b>Total:</b> $${total.toFixed(2)}<br>
<b>Pagado:</b> $${totalPagado.toFixed(2)}<br>
<b>Pendiente:</b> $${totalPendiente.toFixed(2)}
`
}catch(e){
listaVentas.innerHTML=""
resumenVentas.innerHTML=""
alert(mensajeFirebaseError(e))
}
}

function verDetalleVenta(id){

let v=ventasCache.find(x=>x.id==id)

let fecha = v.fecha?.seconds
  ? new Date(v.fecha.seconds * 1000)
  : new Date()

detalleVenta.innerHTML=`
<div class="card">
<h3>${v.figura}</h3>

<b>Cliente:</b> ${v.cliente}<br>
<b>Precio:</b> $${Number(v.precio).toFixed(2)}<br>
<b>Fecha:</b> ${fecha.toLocaleDateString()}<br>
<b>Estado:</b> ${v.pagado?"Pagado":"Pendiente"}

</div>
`
}

function editarVenta(id){

let v=ventasCache.find(x=>x.id==id)

ventaId.value=v.id
cliente.value=v.cliente
precio.value=v.precio
figura.value=v.figura
pagado.checked=v.pagado

let fecha = v.fecha?.seconds
  ? new Date(v.fecha.seconds * 1000)
  : new Date()

fechaVenta.value = fecha.toISOString().split("T")[0]

mostrar("sales",document.querySelectorAll(".tab")[2])
}

async function togglePagado(id){

try{
await esperarFirebase()
let v=ventasCache.find(x=>x.id==id)

await updateDoc(doc(db,"ventas",id),{
pagado: !v.pagado
})

cargarVentas()
}catch(e){alert(mensajeFirebaseError(e))}
}

async function eliminarVenta(id){
if(!confirm("Eliminar venta?")) return
try{
await esperarFirebase()
await deleteDoc(doc(db,"ventas",id))
cargarVentas()
}catch(e){alert(mensajeFirebaseError(e))}
}

// ===== PORTAFOLIO =====

function escapeHtml(s){
return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")
}

function limpiarPortafolio(){
portId.value=""
portNombre.value=""
portCaracteristicas.value=""
portImgData.value=""
portFoto.value=""
portPreview.style.display="none"
portPreview.src=""
}

function mostrarPreviewPort(src){
if(!src){
portPreview.style.display="none"
portPreview.src=""
return
}
portPreview.src=src
portPreview.style.display="block"
}

if(portFoto){
portFoto.addEventListener("change",async()=>{
if(!portFoto.files[0]) return
try{
portImgData.value=""
mostrarPreviewPort(await fileToBase64(portFoto.files[0]))
}catch(e){alert(mensajeFirebaseError(e))}
})
}

if(foto){
foto.addEventListener("change",async()=>{
if(!foto.files[0]) return
try{
const prev=document.getElementById("cotPreview")
if(!prev) return
prev.src=await fileToBase64(foto.files[0])
prev.style.display="block"
}catch(e){alert(mensajeFirebaseError(e))}
})
}

async function guardarPortafolio(){

if(!portNombre.value.trim()) return alert("Nombre requerido")

try{
await esperarFirebase()

let imgData=""
if(portFoto.files[0]){
imgData=await imagenParaGuardar(portFoto.files[0])
}else if(portImgData.value&&esImagenValida(portImgData.value)){
imgData=portImgData.value
}else if(portId.value){
let actual=portafolioCache.find(x=>x.id===portId.value)
imgData=actual?.img||""
}

if(!imgData) return alert("Imagen requerida")

let data={
nombre:portNombre.value.trim(),
caracteristicas:portCaracteristicas.value.trim(),
img:imgData
}

if(portId.value){
await updateDoc(doc(db,"portafolio",portId.value),data)
alert("Pieza actualizada")
}else{
await addDoc(collection(db,"portafolio"),data)
alert("Pieza guardada")
}

limpiarPortafolio()
cargarPortafolio()
}catch(e){alert(mensajeFirebaseError(e))}
}

function renderCaracteristicas(texto){
let items=String(texto||"").split("\n").map(l=>l.trim()).filter(Boolean)
if(!items.length) return "<p style='margin:0;font-size:12px;color:#94a3b8'>Sin características</p>"
return "<ul>"+items.map(i=>"<li>"+escapeHtml(i)+"</li>").join("")+"</ul>"
}

function crearTarjetaPortafolio(p){
const card=document.createElement("div")
card.className="portfolio-card"

const img=document.createElement("img")
img.alt=p.nombre||"Pieza"
img.loading="lazy"
if(esImagenValida(p.img)){
img.src=p.img
img.onerror=()=>{
img.classList.add("sin-imagen")
img.removeAttribute("src")
}
}else{
img.classList.add("sin-imagen")
}

const body=document.createElement("div")
body.className="portfolio-body"
body.innerHTML=`<h4>${escapeHtml(p.nombre)}</h4>${renderCaracteristicas(p.caracteristicas)}`

const actions=document.createElement("div")
actions.className="portfolio-actions"

const btnEdit=document.createElement("button")
btnEdit.textContent="✏️ Editar"
btnEdit.onclick=()=>editarPortafolio(p.id)

const btnDel=document.createElement("button")
btnDel.className="danger"
btnDel.textContent="🗑"
btnDel.onclick=()=>eliminarPortafolio(p.id)

actions.append(btnEdit,btnDel)
card.append(img,body,actions)
return card
}

async function cargarPortafolio(){

try{
await esperarFirebase()
let snap=await getDocs(collection(db,"portafolio"))
portafolioCache=[]
listaPortafolio.innerHTML=""

snap.forEach(d=>{
let p={id:d.id,...d.data()}
portafolioCache.push(p)
listaPortafolio.appendChild(crearTarjetaPortafolio(p))
})

if(!portafolioCache.length){
listaPortafolio.innerHTML="<p style='grid-column:1/-1;color:#94a3b8'>Aún no hay piezas en el portafolio.</p>"
}
}catch(e){
listaPortafolio.innerHTML=""
alert(mensajeFirebaseError(e))
}
}

function editarPortafolio(id){
let p=portafolioCache.find(x=>x.id===id)
if(!p) return

portId.value=p.id
portNombre.value=p.nombre||""
portCaracteristicas.value=p.caracteristicas||""
portFoto.value=""
portImgData.value=p.img||""
mostrarPreviewPort(p.img||"")

mostrar("portfolio",document.querySelectorAll(".tab")[3])
window.scrollTo({top:0,behavior:"smooth"})
}

async function eliminarPortafolio(id){
if(!confirm("¿Eliminar esta pieza del portafolio?")) return
try{
await esperarFirebase()
await deleteDoc(doc(db,"portafolio",id))
cargarPortafolio()
}catch(e){alert(mensajeFirebaseError(e))}
}

// UI
function mostrar(tab,el){

document.getElementById("calc").style.display="none"
document.getElementById("quotes").style.display="none"
document.getElementById("sales").style.display="none"
document.getElementById("portfolio").style.display="none"
document.getElementById("configTab").style.display="none"

document.getElementById(tab).style.display="block"

document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"))
el.classList.add("active")

if(tab=="quotes") cargarCot()
if(tab=="sales") cargarVentas()
if(tab=="portfolio") cargarPortafolio()
if(tab=="configTab") cargarConfig()
}

window.onload=async()=>{
try{
await esperarFirebase()
await cargarConfig()
}catch(e){
console.error(e)
}
mostrar("calc",document.querySelectorAll(".tab")[0])
}

</script>

})
})
}
